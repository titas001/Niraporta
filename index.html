/* ============================== TOKENS ============================== */
:root{
  --brand-magenta:#D10D73; --brand-magenta-dark:#B90F68; --brand-ink:#8A0B4C;
  --accent:#D10D73; --accent-dark:#B90F68; --accent-tint:#FBEEF5; --accent-line:#F3D3E3;
  --sidebar-1:#7B0B45; --sidebar-2:#4E172E; --sidebar-3:#202415;
  --tint-pink:#FBEEF5; --page-bg:#F3E8EE; --card:#FFFFFF; --line:#F0DCE6;
  --footer:#1F2314; --text:#2A1F25; --muted:#6E5D66;
  --chart-cyan:#3DB8E4; --chart-purple:#7F379B;
  --status-new:#A5161A; --status-new-bg:#FDE4E6; --status-new-fg:#C0262D;
  --status-resp:#1E8FC0; --status-resp-bg:#E1F4FC;
  --status-ok:#007060; --status-ok-bg:#DFF3EC;
  --status-warn:#B86E00; --status-warn-bg:#FFF1D6;
  --radius-lg:18px; --radius:12px; --radius-sm:8px;
  --shadow:0 6px 24px rgba(122,11,69,.08);
  --font:"Trebuchet MS","Segoe UI",Tahoma,"Hind Siliguri Embedded",sans-serif;
  --font-bn:"Hind Siliguri Embedded","Hind Siliguri","Noto Sans Bengali","Vrinda",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:light; } }
:root[data-theme="dark"]{ color-scheme:light; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; font-family:var(--font); color:var(--text); background:linear-gradient(135deg,#F7EAF1 0%,#F4EEF2 60%,#F1E6EC 100%); min-height:100vh; display:flex; flex-direction:column; }
button,input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:3px solid #F48FC0; outline-offset:2px; }
@media (prefers-reduced-motion: reduce){ *{ animation:none!important; transition:none!important; } }

/* ============================== STAGE ============================== */
.stage{ flex:1; display:flex; gap:20px; padding:0 20px 20px; align-items:stretch; max-width:1640px; width:100%; margin:0 auto; }
.panel-mobile{ flex:0 0 362px; background:rgba(255,255,255,.55); border-radius:0 0 22px 22px; padding:8px 18px 22px; box-shadow:var(--shadow); }
.panel-title{ font-weight:700; font-size:14px; margin:4px 0 10px; color:var(--text); }
.panel-web{ flex:1; min-width:0; background:rgba(255,255,255,.75); border-radius:0 0 26px 26px; padding:0 18px 18px; box-shadow:var(--shadow); display:flex; flex-direction:column; }

/* ============================== PHONE ============================== */
.phone{ width:326px; height:656px; background:#151214; border-radius:40px; padding:11px; margin:0 auto; position:relative; box-shadow:0 18px 40px rgba(40,10,25,.25); }
.phone-notch{ position:absolute; top:10px; left:50%; transform:translateX(-50%); width:100px; height:24px; background:#151214; border-radius:0 0 16px 16px; z-index:30; }
.screen{ width:100%; height:100%; background:#fff; border-radius:30px; overflow:hidden; display:flex; flex-direction:column; position:relative; }
.screen.lang-bn{ font-family:var(--font-bn); }
.m-header{ background:linear-gradient(180deg,var(--accent) 0%,var(--accent-dark) 100%); color:#fff; padding:30px 12px 10px; display:flex; align-items:center; gap:8px; flex:0 0 auto; }
.m-brand{ display:flex; align-items:center; gap:4px; font-weight:700; font-size:13px; flex:1; }
.m-brand .brac-word{ font-size:18px; letter-spacing:-.4px; }
.lang-toggle{ display:flex; background:rgba(255,255,255,.9); border-radius:999px; padding:2px; border:0; gap:0; height:22px; align-items:center; }
.lang-toggle span{ font-size:9px; padding:3px 6px; border-radius:999px; color:var(--accent-dark); font-weight:700; line-height:1; }
.lang-toggle span.on{ background:var(--accent); color:#fff; }
.icon-btn{ width:26px; height:26px; border-radius:50%; border:0; background:#fff; color:var(--accent-dark); display:grid; place-items:center; position:relative; padding:0; }
.icon-btn.bell{ background:#FFE7A3; }
.badge{ position:absolute; top:-5px; right:-4px; background:#F39200; color:#fff; font-size:9px; min-width:14px; height:14px; border-radius:7px; display:grid; place-items:center; padding:0 3px; font-weight:700; }
.m-body{ flex:1; overflow-y:auto; padding:14px 14px 16px; position:relative; scrollbar-width:thin; }
.m-nav{ flex:0 0 auto; display:flex; justify-content:space-around; border-top:1px solid var(--line); padding:9px 4px 14px; background:#fff; }
.m-nav button{ border:0; background:none; font-size:10.5px; color:var(--accent-dark); padding:4px 6px; border-radius:6px; }
.m-nav button.on{ font-weight:700; color:var(--accent); text-decoration:underline; text-underline-offset:3px; }

.m-h1{ color:var(--accent-dark); font-size:20px; font-weight:700; margin:6px 0 10px; }
.m-sub{ font-size:12.5px; line-height:1.35; margin:0 0 14px; }
.m-label{ display:block; font-size:11.5px; margin:10px 0 5px; color:#4A3B43; }
.m-input,.m-select,.m-textarea{ width:100%; border:1px solid var(--accent-line); background:var(--tint-pink); border-radius:10px; padding:10px 11px; font-size:12px; }
.m-textarea{ resize:none; min-height:58px; line-height:1.35; }
.m-input:focus,.m-select:focus,.m-textarea:focus{ outline:2px solid #F48FC0; border-color:var(--accent); background:#fff; }
.m-input.err,.m-textarea.err{ border-color:var(--status-new-fg); background:#FFF5F6; }
.err-msg{ color:var(--status-new-fg); font-size:10.5px; margin-top:4px; }

  .w-pagehead{ flex-direction:column; }
}

}

let S; let UI_REFRESHED = false; // set when yesterday's saved demo is re-seeded for today
function loadState() {
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) { const p = JSON.parse(raw); if (p && p.v === 2 && p.seedDay === dayKey(DEMO_BASE)) return p; if (p && p.v === 2) UI_REFRESHED = true; } } catch (e) { /* storage unavailable → memory */ }
  return seedState();
}

/* ============================== DERIVED (single source of truth) ============================== */
const D = {
  activeSos: () => S.sos.filter(s => s.status === 'New' || s.status === 'Responding').length,
  openIncidents: () => S.incidents.filter(i => i.status !== 'Closed').length,
  locationShares: () => S.shares.length,
  alertsSent: () => S.broadcasts.length,
  weekDays: () => { const out = []; for (let i = 6; i >= 0; i--) { const d = new Date(DEMO_BASE); d.setDate(d.getDate() - i); d.setHours(12,0,0,0); out.push(d.getTime()); } return out; },
  weekly: () => D.weekDays().map(d => {
    const k = dayKey(d);
    return { label: fmtShort(d), sos: (S.sosArchive[k] || 0) + S.sos.filter(s => dayKey(s.time) === k).length, inc: S.incidents.filter(i => dayKey(i.time) === k).length };
  }),
  sosBreakdown: () => {
    const weekKeys = D.weekDays().map(dayKey);
    const inWeek = S.sos.filter(s => weekKeys.includes(dayKey(s.time)));
    const archived = weekKeys.reduce((a, k) => a + (S.sosArchive[k] || 0), 0); // archived events are all Resolved
    return { New: inWeek.filter(s => s.status === 'New').length, Responding: inWeek.filter(s => s.status === 'Responding').length, Resolved: inWeek.filter(s => s.status === 'Resolved').length + archived };
  },
  byBranch: () => {
    const since = startOfDay(demoNow()) - 29 * 86400000; const counts = {};
    S.incidents.filter(i => i.time >= since).forEach(i => counts[i.branch] = (counts[i.branch] || 0) + 1);
    const keys = [...BRANCH_ORDER.filter(b => counts[b]), ...Object.keys(counts).filter(b => !BRANCH_ORDER.includes(b))];
    return keys.map(b => ({ branch: b, n: counts[b] }));
  },
  unreadFor: pin => { const r = S.reads[pin] || []; return S.broadcasts.filter(b => !r.includes(b.id)).length; },
  activeShare: pin => S.shares.find(s => s.pin === pin && !s.stopped && s.end > demoNow()),
  mySos: pin => S.sos.filter(s => s.pin === pin).sort((a, b) => b.time - a.time)[0],
  me: () => S.session ? (empByPin(S.session) || S.users.find(u => u.pin === S.session || u.id === S.session)) : null,
  latestAdvisory: () => [...S.broadcasts].sort((a, b) => b.time - a.time)[0],
};

/* ============================== SOUND (Web Audio, unlocked on first interaction) ============================== */
function unlockAudio() {
  if (UI.sound.unlocked) return;
  try { UI.sound.ctx = new (window.AudioContext || window.webkitAudioContext)(); UI.sound.ctx.resume(); UI.sound.unlocked = true; } catch (e) { /* no audio */ }
}
document.addEventListener('pointerdown', unlockAudio, { once: false, capture: true });
document.addEventListener('keydown', unlockAudio, { capture: true });
function playSosSound() {
  if (!UI.sound.enabled) return;
  const ctx = UI.sound.ctx;
  if (!ctx || ctx.state !== 'running') { webToast('Sound blocked by the browser', 'Click anywhere on the page once to enable SOS sound alerts.'); return; }
  const now = ctx.currentTime;
  [0, 0.28, 0.56].forEach((o, i) => {
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = 'square'; osc.frequency.setValueAtTime(i % 2 ? 660 : 880, now + o);
    g.gain.setValueAtTime(0.0001, now + o); g.gain.exponentialRampToValueAtTime(0.18, now + o + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, now + o + 0.22);
    osc.connect(g).connect(ctx.destination); osc.start(now + o); osc.stop(now + o + 0.24);
  });
}

function webToast(title, body, kind = '') {
  const box = $('#wToasts'); const el = document.createElement('div');
  el.className = 'w-toast ' + kind; el.innerHTML = `<b>${esc(title)}</b>${esc(body || '')}`;
  box.appendChild(el); setTimeout(() => el.remove(), 4800);
}
let mToastTimer;
// QA fix D5: toasts are added/removed directly in the DOM — a full re-render mid-tap could swallow the user's click
function mobileToast(msg) {
  UI.m.toast = msg; const scr = $('#screen'); scr.querySelector('.m-toast')?.remove();
  const el = document.createElement('div'); el.className = 'm-toast'; el.setAttribute('role', 'status'); el.textContent = msg; scr.appendChild(el);
  clearTimeout(mToastTimer); mToastTimer = setTimeout(() => { UI.m.toast = null; scr.querySelector('.m-toast')?.remove(); }, 3200);
}

function profileFor(id) {
  const e = empByPin(id); if (e) return e;
  const u = S.users.find(x => x.id === id);
  if (u) return { pin: u.id, name: u.name, short: u.name, office: u.office + ' Office', area: u.office, branch: u.office, program: u.program || '—', mobile: u.mobile, place: u.office, lat: 23.8069, lng: 90.3687, selfReg: true };
  return null;
}
const me = () => S.session ? profileFor(S.session) : null;
function ensureUser(e) {
  if (!S.users.find(u => u.pin === e.pin)) S.users.push({ pin: e.pin, name: e.short, office: e.area, reg: 'BRAC PIN', status: 'Verified', mobile: e.mobile, fresh: true });
}
function afterLogin(id) {
  S.session = id; S.devicePin = id; UI.m.err = {}; UI.m.form = {};
  const p = S.profiles[id];
  UI.m.screen = 'home';
  UI.m.overlay = (!p || !p.done) ? 'health' : null;
  logActivity('Login', `${profileFor(id).name} signed in to the mobile app.`);
  commit();
}
function loginSSO() { const e = empByPin('102934'); ensureUser(e); afterLogin(e.pin); }
function loginVerify() {
  const f = UI.m.form, err = {};
  const otp = (f.otp || '').trim();
  if (UI.m.loginTab === 'pin') {
    const pin = (f.pin || '').trim(); const e = empByPin(pin);
    if (!pin) err.pin = t('required'); else if (!e) err.pin = t('errPin');
    if (!/^\d{6}$/.test(otp)) err.otp = t('errOtp');
    UI.m.err = err; if (Object.keys(err).length) return renderMobile();
    ensureUser(e); afterLogin(e.pin);
  } else {
    const mob = (f.mob || '').replace(/[^\d]/g, '').replace(/^880/, '0').replace(/^0?/, '0');
    if (!f.mob) err.mob = t('required');
    const u = S.users.find(x => x.mobile && x.mobile.replace(/[^\d]/g, '').replace(/^880/, '0') === mob);
    const e = EMPLOYEES.find(x => x.mobile.replace(/[^\d]/g, '').replace(/^880/, '0') === mob);
    if (f.mob && !u && !e) err.mob = t('errMobile');
    else if (u && u.status === 'Pending Verification') err.mob = t('errPending');
    else if (u && u.status === 'Rejected') err.mob = t('errRejected');
    if (!/^\d{6}$/.test(otp)) err.otp = t('errOtp');
    UI.m.err = err; if (Object.keys(err).length) return renderMobile();
    if (e) { ensureUser(e); afterLogin(e.pin); } else afterLogin(u.id || u.pin);
  }
}
function signOut() { logActivity('Login', `${me()?.name || 'Employee'} signed out.`); S.session = null; UI.m = { ...UI.m, screen: 'login', overlay: null, form: {}, err: {}, reportDone: null, voice: null }; commit(); }

let sosTimer = null;
function startSosCountdown(trigger = 'Tap') {
  if (!S.session) return mobileToast(t('signInFirst'));
  UI.m.overlay = 'countdown'; UI.m.count = 3; UI.m.trigger = trigger; renderMobile();
  clearInterval(sosTimer);
  sosTimer = setInterval(() => {
    UI.m.count--; if (UI.m.count <= 0) { clearInterval(sosTimer); UI.m.overlay = null; raiseSos(me(), UI.m.trigger, true); } else renderMobile();
  }, 1000);
}
function cancelSos() { clearInterval(sosTimer); UI.m.overlay = null; renderMobile(); mobileToast(t('sosCancelled')); }
function raiseSos(emp, trigger, fromPhone) {
  // QA fix D1: an employee who already has an open SOS escalates it instead of creating a duplicate
  const open = S.sos.find(s => s.pin === emp.pin && (s.status === 'New' || s.status === 'Responding'));
  if (open) {
    const now = demoNow(); open.escalations = (open.escalations || 0) + 1; open.seen = false; open.lastTrigger = now;
    open.timeline.push({ t: now, text: `SOS triggered again from mobile app — escalation ${open.escalations}` });
    logActivity('SOS', `Employee PIN ${emp.selfReg ? emp.name : emp.pin} triggered SOS again (escalated ${open.id}).`);
    UI.w.freshSos = open.id; flash('sos'); if (fromPhone) UI.m.sosBanner = open.id;
    commit(); playSosSound();
    webToast('🚨 SOS escalated', `${emp.name} pressed SOS again · ${open.id} is still ${open.status.toLowerCase()}`, 'sos');
    return;
  }
  const id = 'SOS-' + String(++S.counters.sos).padStart(4, '0'); const now = demoNow();
  const loc = fromPhone ? `Near ${emp.place}` : emp.place;
  S.sos.unshift({ id, pin: emp.pin, name: emp.name, branch: emp.branch, program: emp.program, time: now, location: loc, lat: emp.lat, lng: emp.lng,
    status: 'New', trigger, notes: '', seen: false, timeline: [{ t: now, text: `SOS raised from mobile app${trigger === 'Tap' ? '' : ' (' + trigger.toLowerCase() + ')'}` }, { t: now, text: 'Live location attached' }] });
  // an SOS automatically starts a 30-minute location share
  if (!D.activeShare(emp.pin)) S.shares.push({ id: uid('LS'), pin: emp.pin, name: emp.name, branch: emp.branch, start: now, minutes: 30, end: now + 30*60000, reason: 'SOS' });
  logActivity('SOS', `Employee PIN ${emp.selfReg ? '(self-registered) ' + emp.name : emp.pin} requested assistance.`);
  UI.w.freshSos = id; flash('sos'); flash('share');
  if (fromPhone) UI.m.sosBanner = id;
  commit(); playSosSound();
  webToast('🚨 New SOS received', `${emp.name} (${emp.pin && !emp.selfReg ? 'PIN ' + emp.pin : 'self-registered'}) · ${emp.branch} · ${fmtTime(now)}`, 'sos');
}
function simulateSos() {
  const busy = new Set(S.sos.filter(s => s.status !== 'Resolved').map(s => s.pin));
  const pool = EMPLOYEES.filter(e => !busy.has(e.pin) && e.pin !== S.session);
  const emp = pool[Math.floor(Math.random() * pool.length)] || EMPLOYEES[3];
  raiseSos(emp, Math.random() < .3 ? 'Hardware buttons' : 'Tap', false);
}
function setSosStatus(id, status, note) {
  const s = S.sos.find(x => x.id === id); if (!s) return;
  const now = demoNow();
  if (status === 'Responding') s.timeline.push({ t: now, text: 'Acknowledged by Kollol Nag — responding' });
  if (status === 'Resolved') { s.closure = note; s.timeline.push({ t: now, text: 'Resolved: ' + note }); }
  s.status = status; s.seen = true;
  logActivity('SOS', `${s.id} for PIN ${s.pin} marked ${status.toLowerCase()} by Kollol Nag.`);
  if (status === 'Resolved') { const sh = D.activeShare(s.pin); if (sh && sh.reason === 'SOS') { sh.stopped = true; sh.stoppedAt = now; } }
  if (S.session === s.pin) UI.m.sosBanner = s.id;
  commit();
  webToast(`${s.id} ${status === 'Resolved' ? 'resolved' : 'acknowledged'}`, `${s.name} will see the update on their phone.`);
}
function addSosNote(id, note) {
  const s = S.sos.find(x => x.id === id); if (!s || !note.trim()) return;
  s.timeline.push({ t: demoNow(), text: 'Note: ' + note.trim() }); s.notes = note.trim(); commit('web');
}

const REPORT_DEFAULTS = { cat: 'Road Accident', desc: 'Road accident near field visit location. Need immediate guidance.', loc: 'Mirpur Road, Dhaka' };
function submitReport() {
  // QA fix D2: pre-filled sample values (Picture_8) count as entered values
  const f = UI.m.form; Object.entries(REPORT_DEFAULTS).forEach(([k, v]) => { if (f[k] === undefined) f[k] = v; });
  const err = {};
  if (!(f.desc || '').trim()) err.desc = t('descReq');
  if (!(f.loc ?? 'Mirpur Road, Dhaka').trim()) err.loc = t('locReq');
  if (f.behalf && (!(f.colName || '').trim() || !(f.colPin || '').trim())) err.col = t('colReq');
  UI.m.err = err; if (Object.keys(err).length) return renderMobile();
  const e = me(); const now = demoNow(); const id = `NIR-INC-${YEAR}-${String(++S.counters.inc).padStart(4, '0')}`;
  const col = f.behalf ? { name: f.colName.trim(), pin: f.colPin.trim() } : null;
  const colEmp = col ? empByPin(col.pin) : null;
  S.incidents.push({ id, time: now, branch: colEmp ? colEmp.branch : e.branch, category: f.cat || 'Road Accident', reporterPin: e.pin, reporter: e.name, onBehalf: col,
    description: f.desc.trim(), location: (f.loc ?? 'Mirpur Road, Dhaka').trim(), status: 'New', voice: !!UI.m.voice, timeline: [{ t: now, text: 'Report submitted from mobile app' + (col ? ` on behalf of ${col.name} (PIN ${col.pin})` : '') + (UI.m.voice ? ' with voice note' : '') }] });
  const area = (f.loc ?? 'Mirpur Road, Dhaka').split(',').pop().trim();
  logActivity('Incident', `${f.cat || 'Road Accident'} report submitted from ${area}.`);
  UI.w.freshInc = id; flash('inc');
  UI.m.reportDone = id; UI.m.form = {}; UI.m.voice = null; UI.m.err = {};
  commit();
  webToast('New incident report', `${id} · ${f.cat || 'Road Accident'} · ${e.branch}`);
}
let recTimer = null;
function toggleRecord() {
  if (UI.m.recording) { clearInterval(recTimer); UI.m.recording = false; UI.m.voice = { secs: Math.max(1, UI.m.recSecs) }; renderMobile(); return; }
  UI.m.recording = true; UI.m.recSecs = 0; renderMobile();
  recTimer = setInterval(() => { UI.m.recSecs++; const el = $('#recSecs'); if (el) el.textContent = '0:' + String(UI.m.recSecs).padStart(2, '0'); if (UI.m.recSecs >= 30) toggleRecord(); }, 1000);
}

/* ============================== REGISTRATION ============================== */
function submitRegistration() {
  const f = UI.m.form, err = {};
  ['regName','regMobile','regOffice'].forEach(k => { if (!(f[k] || '').trim()) err[k] = t('required'); });
  if (f.regMobile && !/^(\+?880)?0?1[3-9]\d{8}$/.test(f.regMobile.replace(/[\s-]/g, ''))) err.regMobile = t('phoneErr');
  if (!/^\d{6}$/.test((f.regOtp || '').trim())) err.regOtp = t('errOtp');
  UI.m.err = err; if (Object.keys(err).length) return renderMobile();
  const id = 'U-SR-' + String(++S.counters.reg).padStart(3, '0');
  S.users.push({ id, pin: null, name: f.regName.trim(), office: f.regOffice.trim(), reg: 'Self-Registered', status: 'Pending Verification', mobile: f.regMobile.trim(), program: (f.regProg || '').trim(), designation: (f.regDes || '').trim(), fresh: true });
  logActivity('User', `New self-registration from ${f.regName.trim()} (${f.regOffice.trim()}) awaiting verification.`);
  UI.m.regDone = true; UI.m.form = {}; commit();
  webToast('New self-registration', `${f.regName.trim()} · ${f.regOffice.trim()} — pending verification`);
}
function setUserStatus(key, status) {
  const u = S.users.find(x => (x.id || x.pin) === key); if (!u) return;
  u.status = status; logActivity('User', `${u.name} ${status === 'Verified' ? 'verified' : 'rejected'} by Kollol Nag.`);
  commit(); webToast(`User ${status === 'Verified' ? 'verified' : 'rejected'}`, status === 'Verified' ? `${u.name} can now sign in with mobile number ${u.mobile}.` : `${u.name} has been informed.`);
}

/* ============================== BROADCAST ============================== */
function sendBroadcast() {
  const type = UI.w.bType || 'Emergency Security Alert';
  const msg = (UI.w.bMsg ?? 'Security advisory: avoid non-essential movement near affected area until further notice.').trim();
  if (!msg) { UI.w.bErr = 'Write the message employees will receive.'; return renderWeb(); }
  UI.w.bErr = null;
  const recipients = 1240 + S.users.filter(u => u.fresh && u.status === 'Verified').length;
  S.broadcasts.push({ id: uid('B'), type, message: msg, time: demoNow(), recipients });
  logActivity('Broadcast', `${type} sent to ${recipients.toLocaleString('en-US')} employees.`);
  flash('alerts'); UI.w.bMsg = undefined; commit();
  webToast('Push notification sent', `${type} delivered to ${recipients.toLocaleString('en-US')} employees.`);
  if (S.session) setTimeout(() => mobileToast('🔔 ' + t('newAlert') + ': ' + msg.slice(0, 70) + (msg.length > 70 ? '…' : '')), 400);
}
function markAlertsRead() { const pin = S.session || S.devicePin; S.reads[pin] = S.broadcasts.map(b => b.id); persist(); renderMobile(); }

/* ============================== INCIDENT STATUS (web) ============================== */
function setIncidentStatus(id, status, note) {
  const i = S.incidents.find(x => x.id === id); if (!i) return;
  i.status = status; i.timeline.push({ t: demoNow(), text: `Status changed to ${status} by Kollol Nag` + (note ? ': ' + note : '') });
  logActivity('Incident', `${id} marked ${status.toLowerCase()}.`); commit();
  webToast('Incident updated', `${id} → ${status}`);
}

/* SOS button: tap = start countdown; hold 1.2 s = start countdown immediately with haptic-style feedback */
function bindSos() {
  const b = $('#sosBtn'); if (!b) return; let holdT = null, fired = false;
  const down = ev => { ev.preventDefault(); fired = false; b.classList.add('holding'); holdT = setTimeout(() => { fired = true; b.classList.remove('holding'); startSosCountdown('Hold'); }, 1200); };
  const up = () => { b.classList.remove('holding'); if (holdT) clearTimeout(holdT); if (!fired) startSosCountdown('Tap'); fired = true; };
  b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up);
  b.addEventListener('pointerleave', () => { b.classList.remove('holding'); clearTimeout(holdT); fired = true; });
  b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); startSosCountdown('Tap'); } });
}

/* ============================== CHARTS (inline SVG — work offline) ============================== */
function chartWeekly() {
  const data = D.weekly(); const W = 620, H = 300, L = 34, R = 10, T = 10, B = 30;
  const max = Math.max(3, ...data.map(d => Math.max(d.sos, d.inc)));
  const pw = W - L - R, ph = H - T - B, gw = pw / data.length, bw = Math.min(30, gw * 0.36);
  let g = '';
  for (let i = 0; i <= max; i++) { const y = T + ph - ph * i / max; g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#EFE3EA"/><text x="${L - 10}" y="${y + 3}" font-size="10" text-anchor="end" fill="#6E5D66">${i}</text>`; }
  data.forEach((d, i) => {
    const x0 = L + gw * i; g += `<line x1="${x0}" x2="${x0}" y1="${T}" y2="${T + ph}" stroke="#F4EAF0"/>`;
    const cx = x0 + gw / 2; const hs = ph * d.sos / max, hi = ph * d.inc / max;
    g += `<rect x="${cx - bw - 2}" y="${T + ph - hs}" width="${bw}" height="${hs}" fill="#D10D73"><title>${d.label}: ${d.sos} SOS alerts</title></rect>`;
    g += `<rect x="${cx + 2}" y="${T + ph - hi}" width="${bw}" height="${hi}" fill="#3DB8E4"><title>${d.label}: ${d.inc} incidents reported</title></rect>`;
    g += `<text x="${cx}" y="${H - 10}" font-size="10" text-anchor="middle" fill="#4A3B43">${d.label}</text>`;
  });
  g += `<line x1="${L}" x2="${W - R}" y1="${T + ph}" y2="${T + ph}" stroke="#D9C6D0"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Weekly SOS alerts and incidents reported, last 7 days">${g}</svg>
  <div class="legend"><span><i style="background:#D10D73"></i>SOS Alerts</span><span><i style="background:#3DB8E4"></i>Incidents Reported</span></div>`;
}
function chartDonut() {
  const b = D.sosBreakdown(); const parts = [['New', b.New, '#A5161A'], ['Responding', b.Responding, '#3DB8E4'], ['Resolved', b.Resolved, '#007060']];
  const total = parts.reduce((a, p) => a + p[1], 0) || 1; const r = 92, C = 2 * Math.PI * r; let off = 0, segs = '';
  parts.forEach(([n, v, c]) => { const len = C * v / total; segs += `<circle cx="150" cy="150" r="${r}" fill="none" stroke="${c}" stroke-width="64" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 150 150)"><title>${n}: ${v} (${Math.round(v / total * 100)}%)</title></circle>`; off += len; });
  return `<svg viewBox="0 0 300 300" width="100%" style="max-height:330px" role="img" aria-label="SOS status breakdown this week: ${parts.map(p => p[0] + ' ' + p[1]).join(', ')}">${segs}<circle cx="150" cy="150" r="60" fill="#fff"/><text x="150" y="146" text-anchor="middle" font-size="22" font-weight="700" fill="#8A0B4C">${total}</text><text x="150" y="164" text-anchor="middle" font-size="9.5" fill="#6E5D66">SOS this week</text></svg>
  <div class="legend">${parts.map(p => `<span><i style="background:${p[2]}"></i>${p[0]} (${p[1]})</span>`).join('')}</div>`;
}
function chartBranch() {
  const data = D.byBranch(); const max = Math.max(8, ...data.map(d => d.n)); const W = 470, L = 70, R = 14, rowH = 64, T = 8, H = T + rowH * data.length + 26, pw = W - L - R;
  let g = '';
  for (let i = 0; i <= max; i++) { const x = L + pw * i / max; g += `<line x1="${x}" x2="${x}" y1="${T}" y2="${T + rowH * data.length}" stroke="#EFE3EA"/><text x="${x}" y="${H - 8}" font-size="10" text-anchor="middle" fill="#4A3B43">${i}</text>`; }
  data.forEach((d, i) => { const y = T + rowH * i + 8; g += `<text x="${L - 8}" y="${y + 27}" font-size="10" text-anchor="end" fill="#4A3B43">${esc(d.branch)}</text><rect x="${L}" y="${y}" width="${pw * d.n / max}" height="${rowH - 16}" fill="#7F379B"><title>${esc(d.branch)}: ${d.n} incidents in the last 30 days</title></rect>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Incidents by branch, last 30 days: ${data.map(d => d.branch + ' ' + d.n).join(', ')}">${g}</svg>`;
}

    <div class="dr-sec"><h4>Live location</h4><div class="mini-map"><span class="pin">${ICON.pin(20)}</span><span class="lbl">${esc(s.location)} · ${s.lat.toFixed(4)}° N, ${s.lng.toFixed(4)}° E</span></div></div>
    <div class="dr-sec"><h4>Alert</h4><div class="kv"><div>Raised</div><div>${fmtDT(s.time)}</div><div>Trigger</div><div>${esc(s.trigger)}</div><div>Mobile</div><div>${esc(emp.mobile || '—')}</div><div>Office</div><div>${esc(emp.office || '—')}</div></div></div>
    <div class="dr-sec"><h4>Emergency health &amp; family contact</h4><div class="kv"><div>Blood group</div><div>${esc(p.blood || 'Not provided')}</div><div>Medical / allergies</div><div>${esc(p.medical || 'None recorded')}</div><div>Family contact</div><div>${esc(p.famName || 'Not provided')}</div><div>Family phone</div><div>${esc(p.famPhone || '—')}</div></div>
      <div style="font-size:10px;color:#6E5D66;margin-top:6px">🔒 Visible to SCC duty officers during an active SOS only. Each view is logged.</div></div>
    <div class="dr-sec"><h4>Timeline</h4><ul class="timeline">${s.timeline.map(x => `<li>${esc(x.text)}<div class="t">${fmtDT(x.t)}</div></li>`).join('')}</ul></div>
    ${s.status !== 'Resolved' ? `<div class="dr-sec"><h4>Add note</h4><div style="display:flex;gap:6px"><input class="w-full" data-wf="sosNote" placeholder="e.g. Called employee; area office informed." value="${esc(UI.w.sosNote || '')}"><button class="btn-web ghost" data-wact="addNote" data-v="${s.id}">Add</button></div></div>` : ''}
  </div><div class="dr-foot">${foot}</div>`;
}
function drawerInc(i) {
  const next = { 'New':['In Review'], 'In Review':['Action Taken','Closed'], 'Action Taken':['Closed'], 'Closed':[] }[i.status];
  return `<div class="dr-head"><div><h2>${i.id}</h2><div class="s">${esc(i.category)} · ${esc(i.branch)} · ${fmtDT(i.time)}</div><div style="margin-top:6px">${pill(i.status)}</div></div><button class="w-icon" data-wact="closeDrawer" aria-label="Close">✕</button></div>
  <div class="dr-body">
    <div class="dr-sec"><h4>Report</h4><p style="margin:0;line-height:1.45">${esc(i.description)}</p></div>
    <div class="dr-sec"><div class="kv"><div>Reported by</div><div>${esc(i.reporter)} (${pinShow(i.reporterPin) === '—' ? 'self-registered' : 'PIN ' + i.reporterPin})</div>${i.onBehalf ? `<div>On behalf of</div><div>${esc(i.onBehalf.name)} (PIN ${esc(i.onBehalf.pin)})</div>` : ''}<div>Location</div><div>${esc(i.location)}</div><div>Voice note</div><div>${i.voice ? '🎧 Attached (playback simulated in demo)' : 'None'}</div></div></div>
    <div class="dr-sec"><h4>Timeline</h4><ul class="timeline">${i.timeline.map(x => `<li>${esc(x.text)}<div class="t">${fmtDT(x.t)}</div></li>`).join('')}</ul></div>
    ${next.length ? `<div class="dr-sec"><h4>Update note (optional)</h4><input class="w-full" data-wf="incNote" placeholder="e.g. Area manager informed." value="${esc(UI.w.incNote || '')}"></div>` : ''}
  </div><div class="dr-foot">${next.length ? next.map(n => `<button class="btn-web ${n === 'Closed' ? 'green' : ''}" data-wact="incStatus" data-v="${i.id}" data-s="${n}">Mark ${n}</button>`).join('') : '<span style="font-size:12px;color:#00513F">✓ Case closed</span>'}</div>`;
}
function modalShares() {
  const now = demoNow(); const active = S.shares.filter(s => !s.stopped && s.end > now); const recent = [...S.shares].sort((a, b) => b.start - a.start).slice(0, 10);
  return `<div class="w-modal-bg" data-wact="closeModal"><div class="w-modal" role="dialog" aria-modal="true" aria-labelledby="shTitle" data-stop="1">
    <div style="display:flex;justify-content:space-between"><h3 id="shTitle">Location Shares (${S.shares.length} this month)</h3><button class="w-icon" data-wact="closeModal" aria-label="Close">✕</button></div>
    <p style="font-size:12px;margin:0 0 10px"><b>${active.length}</b> sharing live now.</p>
    <div class="table-wrap"><table class="dt" style="min-width:480px"><thead><tr><th>Employee</th><th>Branch</th><th>Started</th><th>Duration</th><th>Reason</th><th>Status</th></tr></thead><tbody>
    ${recent.map(s => { const live = !s.stopped && s.end > now; return `<tr><td>${esc(s.name)}</td><td>${esc(s.branch)}</td><td style="white-space:nowrap">${fmtDT(s.start)}</td><td>${s.minutes >= 60 ? s.minutes / 60 + ' hr' : s.minutes + ' min'}</td><td>${s.reason}</td><td>${live ? '<span class="pill Resolved">● Live</span>' : '<span class="pill Closed" style="background:#F1EDF0;color:#6E5D66">Ended</span>'}</td></tr>`; }).join('')}
    </tbody></table></div></div></div>`;
}

function renderWeb() {
  const main = $('#web'); const prev = main.querySelector('.w-main')?.scrollTop || 0;
  const focusKey = document.activeElement?.dataset?.wf; const caret = document.activeElement?.selectionStart;
  const page = { overview: pOverview, sos: pSos, incidents: pIncidents, broadcast: pBroadcast, users: pUsers }[UI.w.page]();
  main.innerHTML = wHeader() + `<div class="w-shell">${wSide()}<div class="w-main">${wPageHead()}${page}</div></div>`;
  main.querySelector('.w-main').scrollTop = prev;
  if (focusKey) { const el = main.querySelector(`[data-wf="${focusKey}"]`); if (el) { el.focus(); try { if (caret != null) el.setSelectionRange(caret, caret); } catch (e) {} } }
  const ov = $('#webOverlay'); let d = '';
  if (UI.w.drawer) { const it = UI.w.drawer.type === 'sos' ? S.sos.find(s => s.id === UI.w.drawer.id) : S.incidents.find(s => s.id === UI.w.drawer.id); if (it) d = `<div class="drawer-bg" data-wact="closeDrawer"></div><aside class="drawer" role="dialog" aria-modal="true">${UI.w.drawer.type === 'sos' ? drawerSos(it) : drawerInc(it)}</aside>`; }
  if (UI.w.modal === 'shares') d += modalShares();
  setTimeout(tickClockAndWaits, 0);
  if (ov.dataset.sig !== d) { const fk = document.activeElement?.dataset?.wf; ov.innerHTML = d; ov.dataset.sig = d; if (fk) ov.querySelector(`[data-wf="${fk}"]`)?.focus(); }
}

/* ============================== EVENTS & SYNC ============================== */
// ---- mobile ----
$('#screen').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
  const go = to => { UI.m.screen = to; UI.m.err = {}; if (to !== 'report') UI.m.reportDone = null; if (to === 'register') UI.m.regDone = false; renderMobile(); };
  switch (a) {
    case 'lang': S.lang = S.lang === 'en' ? 'bn' : 'en'; persist(); renderMobile(); break;
    case 'go': {
      const to = b.dataset.to;
      if (!S.session && !['login','register','faq','alerts'].includes(to)) { UI.m.screen = 'login'; renderMobile(); if (to !== 'home') mobileToast(t('signInFirst')); break; }
      if (to === 'alerts') { go('alerts'); setTimeout(markAlertsRead, 1500); break; }
      go(to); break; }
    case 'ltab': UI.m.loginTab = b.dataset.v; UI.m.err = {}; renderMobile(); break;
    case 'sso': loginSSO(); break;
    case 'verify': loginVerify(); break;
    case 'register': submitRegistration(); break;
    case 'regback': UI.m.regDone = false; go('login'); break;
    case 'saveHealth': saveHealth(); break;
    case 'skipHealth': if (!S.settings.requireHealth) { UI.m.overlay = null; UI.m.form = {}; UI.m.err = {}; renderMobile(); } break;
    case 'openHealth': openHealth(); break;
    case 'cancelSos': cancelSos(); break;
    case 'dismissSos': UI.m.sosBanner = null; renderMobile(); break;
    case 'dur': UI.m.form.dur = +b.dataset.v; renderMobile(); break;
    case 'startShare': startShare(); break;
    case 'stopShare': stopShare(); break;
    case 'rec': toggleRecord(); break;
    case 'rmVoice': UI.m.voice = null; renderMobile(); break;
    case 'submitReport': submitReport(); break;
    case 'newReport': UI.m.reportDone = null; UI.m.form = {}; renderMobile(); break;
    case 'call': mobileToast(`📞 ${t('calling')} ${b.dataset.name} (${b.dataset.num}) — ${t('simulated')}`); break;
    case 'needFam': mobileToast(t('addFamFirst')); setTimeout(openHealth, 600); break;
    case 'signOut': signOut(); break;
    case 'readAll': markAlertsRead(); break;
  }
});
$('#screen').addEventListener('input', e => {
  const k = e.target.dataset.f; if (!k) return;
  UI.m.form[k] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  if (UI.m.err[k]) { delete UI.m.err[k]; e.target.classList.remove('err'); const m = e.target.nextElementSibling; if (m && m.classList.contains('err-msg')) m.remove(); }
});
$('#screen').addEventListener('change', e => {
  if (e.target.dataset.f === 'behalf') { UI.m.form.behalf = e.target.checked; renderMobile(); return; }
  const s = e.target.dataset.set; if (!s) return;
  S.settings[s] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  if (s === 'requireHealth') logActivity('Settings', `Emergency health & family info is now ${e.target.checked ? 'mandatory' : 'optional'} after login.`);
  persist(); renderMobile();
});

// ---- web ----
document.addEventListener('click', e => {
  const b = e.target.closest('[data-wact]');
  if (!b) { if (UI.w.dd && !e.target.closest('.dropdown')) { UI.w.dd = null; renderWeb(); } return; }
  if (b.classList.contains('w-modal-bg') && e.target.closest('[data-stop]') && !e.target.closest('[data-wact="closeModal"]:not(.w-modal-bg)')) return;
  const a = b.dataset.wact, v = b.dataset.v;
  if (a !== 'dd' && UI.w.dd) UI.w.dd = null;
  switch (a) {
    case 'page': UI.w.page = v; UI.w.freshSos = UI.w.freshInc = null; renderWeb(); break;
    case 'kpi': if (v === 'shares') { UI.w.modal = 'shares'; renderWeb(); } else { UI.w.page = v; if (v === 'incidents') UI.w.incFilter.status = 'open'; renderWeb(); } break;
    case 'simulate': simulateSos(); break;
    case 'sound': UI.sound.enabled = !UI.sound.enabled; renderWeb(); webToast(UI.sound.enabled ? 'SOS sound on' : 'SOS sound off', UI.sound.enabled ? 'A sound plays for every new SOS.' : 'New SOS alerts will show without sound.'); break;
    case 'dd': UI.w.dd = UI.w.dd === v ? null : v; renderWeb(); break;
    case 'reset': if (UI.w.resetArmed) { UI.w.resetArmed = false; resetDemo(); } else { UI.w.resetArmed = true; UI.w.dd = 'user'; renderWeb(); } break;
    case 'search': UI.w.searchOpen = !UI.w.searchOpen; if (UI.w.page === 'overview' || UI.w.page === 'broadcast') UI.w.page = 'sos'; renderWeb(); setTimeout(() => $('#wSearch')?.focus(), 0); break;
    case 'openSos': { const s = S.sos.find(x => x.id === v); s.seen = true; UI.w.drawer = { type: 'sos', id: v }; UI.w.closeNote = ''; UI.w.closeErr = null; UI.w.sosNote = ''; renderWeb(); break; }
    case 'openInc': UI.w.drawer = { type: 'inc', id: v }; UI.w.incNote = ''; renderWeb(); break;
    case 'closeDrawer': UI.w.drawer = null; renderWeb(); break;
    case 'closeModal': UI.w.modal = null; renderWeb(); break;
    case 'sosResp': setSosStatus(v, 'Responding'); break;
    case 'sosResolve': { const n = (UI.w.closeNote || '').trim(); if (!n) { UI.w.closeErr = 'Add a closure note before resolving.'; renderWeb(); break; } UI.w.closeErr = null; setSosStatus(v, 'Resolved', n); UI.w.closeNote = ''; break; }
    case 'addNote': addSosNote(v, UI.w.sosNote || ''); UI.w.sosNote = ''; renderWeb(); break;
    case 'call': webToast('📞 Calling employee', `${v || 'No number on file'} — simulated in demo`); break;
    case 'incStatus': setIncidentStatus(v, b.dataset.s, (UI.w.incNote || '').trim()); UI.w.incNote = ''; break;
    case 'send': sendBroadcast(); break;
    case 'pickDate': { const el = document.querySelector(`.native-date[data-wf="${v}"]`); try { el.showPicker(); } catch (err) { el.click(); } break; }
    case 'clearDates': UI.w.sosFilter.from = UI.w.sosFilter.to = ''; UI.w.sosFromTxt = UI.w.sosToTxt = undefined; renderWeb(); break;
    case 'verify': setUserStatus(v, 'Verified'); break;
    case 'reject': setUserStatus(v, 'Rejected'); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (UI.w.drawer || UI.w.modal || UI.w.dd) { UI.w.drawer = null; UI.w.modal = null; UI.w.dd = null; renderWeb(); } }
  if (e.key === 'Enter' && e.target.matches('tr[data-wact]')) e.target.click();
});
document.addEventListener('input', e => {
  const k = e.target.dataset.wf; if (!k) return; const v = e.target.value;
  // typed dd/mm/yyyy dates: apply only when empty or a complete valid date, so typing is never interrupted
  if (k === 'sosFromTxt' || k === 'sosToTxt') {
    let val = v.replace(/[^\d/]/g, ''); if (/^\d{2}$/.test(val) || /^\d{2}\/\d{2}$/.test(val)) { if (e.inputType !== 'deleteContentBackward') val += '/'; }
    if (val !== v) e.target.value = val; UI.w[k] = val; const iso = dmyToIso(val); const fk = k === 'sosFromTxt' ? 'from' : 'to';
    if (!val) { UI.w.sosFilter[fk] = ''; UI.w[k] = undefined; renderWeb(); }
    else if (iso) { UI.w.sosFilter[fk] = iso; renderWeb(); }
    else e.target.closest('.daterange').classList.toggle('bad', val.length >= 10);
    return;
  }
  if (k === 'sosFrom' || k === 'sosTo') { UI.w.sosFilter[k === 'sosFrom' ? 'from' : 'to'] = v; UI.w[k + 'Txt'] = undefined; renderWeb(); return; }
  const map = { sosq: ['sosFilter','q'], sosStatus: ['sosFilter','status'], sosBranch: ['sosFilter','branch'], incq: ['incFilter','q'], incStatus: ['incFilter','status'], incBranch: ['incFilter','branch'] };
  if (map[k]) { UI.w[map[k][0]][map[k][1]] = v; renderWeb(); return; }
  if (k === 'q') { if (UI.w.page === 'incidents') UI.w.incFilter.q = v; else if (UI.w.page === 'users') UI.w.userQ = v; else UI.w.sosFilter.q = v; renderWeb(); return; }
  UI.w[k] = v; // drawer notes, broadcast form — stored without re-render
});

// ---- 1-second tick: location countdowns + auto-expiry (updates text only, so typing is never interrupted) ----
function tickClockAndWaits() {
  const n = new Date();
  document.querySelectorAll('[data-clock="d"]').forEach(el => el.textContent = n.toLocaleDateString('en-GB', { weekday:'short', day:'2-digit', month:'short', year:'numeric' }));
  document.querySelectorAll('[data-clock="t"]').forEach(el => el.textContent = fmtTime(n.getTime()));
  document.querySelectorAll('[data-wait]').forEach(el => {
    const mins = Math.floor((demoNow() - +el.dataset.wait) / 60000), secs = Math.floor((demoNow() - +el.dataset.wait) / 1000) % 60;
    const late = mins >= ACK_TARGET_MIN; el.classList.toggle('late', late);
    el.textContent = `Waiting ${mins < 60 ? mins + ' min ' + String(secs).padStart(2, '0') + ' s' : Math.floor(mins / 60) + ' hr ' + (mins % 60) + ' min'}${late ? ' · over 2-min target' : ''}`;
  });
}
function tickCountdowns() {
  tickClockAndWaits();
  document.querySelectorAll('[data-countdown]').forEach(el => {
    const left = Math.max(0, +el.dataset.countdown - demoNow()); const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
    const txt = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; el.textContent = S.lang === 'bn' ? bnDigits(txt) : txt;
  });
}
setInterval(() => {
  tickCountdowns();
  const now = demoNow(); let ended = false;
  S.shares.forEach(s => { if (!s.stopped && !s.expired && s.end <= now && s.start > DEMO_BASE - 86400000) { s.expired = true; s.stopped = true; s.stoppedAt = s.end; ended = true; } });
  if (ended) { commit(); if (S.shares.some(s => s.expired && s.pin === S.session && s.end > demoNow() - 1500)) mobileToast(t('shareEnded')); }
}, 1000);
// refresh relative times ("2 min ago") without disturbing forms
setInterval(() => { if (UI.w.page === 'overview' && !UI.w.drawer && !UI.w.modal && !UI.w.dd) renderWeb(); }, 30000);

/* ============================== INIT ============================== */
$('#footLogo').innerHTML = brandHTML(24, '#fff');
// seeded historical shares are already finished
S.shares.forEach(s => { if (s.end < DEMO_BASE - 3600000) s.stopped = true; });
renderMobile(); renderWeb();
if (UI_REFRESHED) webToast('Demo data refreshed for today', 'Dates now follow today. Your changes from an earlier day were reset.');
window.NIRAPATTA = { state: () => S, D, reset: resetDemo, simulateSos }; // exposed for QA automation
</script>
